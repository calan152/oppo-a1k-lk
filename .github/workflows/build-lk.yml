name: Build OPPO A1K LK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lk.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    name: Apply OPPO A1K LK patch
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v6
        with:
          path: patchrepo

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            coreutils \
            curl \
            ca-certificates \
            perl \
            file \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libc6-i386 \
            lib32stdc++6 \
            lib32z1 \
            zlib1g-dev

      - name: Install Python 2.7.18
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o /tmp/miniconda2.sh \
            https://repo.anaconda.com/miniconda/Miniconda2-py27_4.8.3-Linux-x86_64.sh

          bash /tmp/miniconda2.sh -b -p "$HOME/miniconda2"

          sudo ln -sf \
            "$HOME/miniconda2/bin/python" \
            /usr/bin/python2

          /usr/bin/python2 --version

      - name: Clone exact MT6765 LK base
        shell: bash
        run: |
          set -euo pipefail

          git clone https://github.com/svoboda18/lk.git lk

          cd lk

          git checkout 37ec8bc

          echo
          echo "=== Base revision ==="
          git rev-parse HEAD

          test "$(git rev-parse --short=7 HEAD)" = "37ec8bc"

      - name: Remove base DTB
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          if [ -f main_dtb_header.bin ]; then
            echo "Base repository DTB detected:"
            ls -l main_dtb_header.bin
            file main_dtb_header.bin || true

            echo
            echo "::warning::Removing base main_dtb_header.bin."
            echo "::warning::A CPH1923-specific DTB must be supplied separately."

            rm -f main_dtb_header.bin
          fi

          test ! -f main_dtb_header.bin

      - name: Check patch applicability
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          git apply --check \
            ../patchrepo/patches/0001-oppo-a1k-cph1923-port.patch

          echo "Patch applies cleanly: OK"

      - name: Apply OPPO A1K patch
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          git apply \
            ../patchrepo/patches/0001-oppo-a1k-cph1923-port.patch

          echo
          echo "=== Modified files ==="
          git status --short

      - name: Verify patched CPH1923 target
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          test -f project/oppo6762_18540.mk
          test -f target/oppo6762_18540/rules.mk
          test -d tests/bootimg_validator

          echo "project/oppo6762_18540.mk: OK"
          echo "target/oppo6762_18540/rules.mk: OK"
          echo "tests/bootimg_validator: OK"

      - name: Verify bundled MTK toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          test -x gcc/bin/arm-linux-androideabi-gcc
          test -x gcc/bin/arm-linux-androideabi-ld.bfd
          test -x scripts/mkimage

          echo "=== GCC ==="
          gcc/bin/arm-linux-androideabi-gcc --version

          echo
          echo "=== LD ==="
          gcc/bin/arm-linux-androideabi-ld.bfd --version

          echo
          echo "=== mkimage ==="
          file scripts/mkimage

      - name: Verify Python 2 compiler wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          head -n 1 gcc/bin/arm-linux-androideabi-gcc

          grep -q '^#!/usr/bin/python2$' \
            gcc/bin/arm-linux-androideabi-gcc

          echo "Compiler wrapper uses /usr/bin/python2: OK"

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          git diff --check

          echo "git diff --check: OK"

      - name: Run boot image validator tests
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          make -C tests/bootimg_validator clean test

      - name: Show full-build prerequisites
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          echo "=== LK build prerequisites ==="

          test -x /usr/bin/python2
          test -x gcc/bin/arm-linux-androideabi-gcc
          test -x gcc/bin/arm-linux-androideabi-ld.bfd
          test -x scripts/mkimage

          echo "Python 2: OK"
          echo "ARM GCC: OK"
          echo "ARM LD: OK"
          echo "MTK mkimage: OK"

          echo
          echo "CPH1923 DTB:"
          if [ -f main_dtb_header.bin ]; then
            echo "FOUND"
          else
            echo "NOT PROVIDED — expected at this stage"
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "## OPPO A1K LK integration"
            echo
            echo "- Ubuntu 22.04: OK"
            echo "- Python 2.7.18: OK"
            echo "- Base LK commit 37ec8bc: checked out"
            echo "- OPPO A1K patch: applied"
            echo "- Bundled Android ARM GCC 4.9: OK"
            echo "- MTK mkimage: OK"
            echo "- bootimg validator tests: executed"
            echo
            echo "Full lk.bin build is intentionally not started yet."
            echo "A CPH1923-specific main_dtb_header.bin must be supplied first."
          } >> "$GITHUB_STEP_SUMMARY"
