
name: Build OPPO A1K LK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-lk.yml"
      - "patches/**"

permissions:
  contents: read

jobs:
  build:
    name: Build OPPO A1K LK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout OPPO A1K patch repository
        uses: actions/checkout@v6
        with:
          path: patchrepo

      - name: Install Ubuntu dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            coreutils \
            curl \
            ca-certificates \
            perl \
            file \
            bc \
            bison \
            flex \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libc6-i386 \
            lib32stdc++6 \
            lib32z1 \
            zlib1g-dev \
            libncurses-dev \
            device-tree-compiler

      - name: Install Python 2.7.18
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o /tmp/miniconda2.sh \
            https://repo.anaconda.com/miniconda/Miniconda2-py27_4.8.3-Linux-x86_64.sh

          bash /tmp/miniconda2.sh \
            -b \
            -p "$HOME/miniconda2"

          sudo ln -sf \
            "$HOME/miniconda2/bin/python" \
            /usr/bin/python2

          echo "=== Python ==="
          /usr/bin/python2 --version

      - name: Clone base LK
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://github.com/svoboda18/lk.git \
            lk

          cd lk

          git checkout 37ec8bc

          echo
          echo "=== Base LK revision ==="
          git rev-parse HEAD

      - name: Apply OPPO A1K patch
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          echo "=== Applying patch ==="

          git apply \
            ../patchrepo/patches/0001-oppo-a1k-cph1923-port.patch

          echo
          echo "=== Patched files ==="
          git status --short

      - name: Verify LK toolchain
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          echo "=== GNU Make ==="
          make --version

          echo
          echo "=== Python 2 ==="
          /usr/bin/python2 --version

          echo
          echo "=== Android ARM GCC ==="
          test -x gcc/bin/arm-linux-androideabi-gcc
          gcc/bin/arm-linux-androideabi-gcc --version

          echo
          echo "=== Android ARM linker ==="
          test -x gcc/bin/arm-linux-androideabi-ld.bfd
          gcc/bin/arm-linux-androideabi-ld.bfd --version

          echo
          echo "=== MTK mkimage ==="
          test -x scripts/mkimage
          file scripts/mkimage

      - name: Build OPPO A1K LK
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          echo "========================================"
          echo " Building OPPO A1K / CPH1923 LK"
          echo " Project: oppo6762_18540"
          echo "========================================"

          make -j"$(nproc)" \
            oppo6762_18540 \
            NO_SIGN=yes

      - name: Verify built LK
        shell: bash
        run: |
          set -euo pipefail

          cd lk

          LK="build-oppo6762_18540/flash/lk.bin"

          echo "=== Checking output ==="

          test -s "$LK"

          echo
          echo "=== File ==="
          ls -lh "$LK"
          file "$LK"

          echo
          echo "=== Size ==="
          SIZE="$(stat -c '%s' "$LK")"
          echo "$SIZE bytes"

          echo
          echo "=== SHA-256 ==="
          sha256sum "$LK"

          if [ "$SIZE" -ne 1048576 ]; then
            echo "::error::Unexpected lk.bin size: $SIZE bytes"
            echo "::error::Expected exactly 1048576 bytes (1 MiB)"
            exit 1
          fi

          echo
          echo "LK build verification: OK"
          echo "lk.bin size: exactly 1 MiB"

      - name: Upload LK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oppo-a1k-lk
          path: lk/build-oppo6762_18540/flash/lk.bin
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          LK="lk/build-oppo6762_18540/flash/lk.bin"
          SIZE="$(stat -c '%s' "$LK")"
          SHA256="$(sha256sum "$LK" | awk '{print $1}')"

          {
            echo "## OPPO A1K LK build"
            echo
            echo "- Runner: Ubuntu 22.04"
            echo "- Python: 2.7.18"
            echo "- Base LK: svoboda18/lk @ 37ec8bc"
            echo "- Project: oppo6762_18540"
            echo "- NO_SIGN: yes"
            echo "- Build: SUCCESS"
            echo "- lk.bin size: $SIZE bytes"
            echo "- SHA-256: \`$SHA256\`"
            echo
            echo "Artifact: **oppo-a1k-lk**"
          } >> "$GITHUB_STEP_SUMMARY"