name: LK toolchain preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lk-toolchain-check.yml"

permissions:
  contents: read

jobs:
  toolchain-check:
    name: MTK LK toolchain preflight
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install host compatibility packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            file \
            binutils

      - name: Show host compiler
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Host GCC ==="
          gcc --version
          echo
          echo "Target:"
          gcc -dumpmachine

      - name: Test 32-bit host binaries
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/test32.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              puts("32-bit host test: OK");
              return 0;
          }
          EOF

          gcc -m32 /tmp/test32.c -o /tmp/test32

          echo "=== File type ==="
          file /tmp/test32

          echo
          echo "=== Running ==="
          /tmp/test32

      - name: Search for ARM cross compilers
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Cross compilers in PATH ==="

          found=0

          for cc in \
            arm-eabi-gcc \
            arm-linux-androideabi-gcc \
            arm-linux-gnueabi-gcc \
            arm-linux-gnueabihf-gcc \
            aarch64-linux-android-gcc \
            aarch64-linux-gnu-gcc
          do
            if command -v "$cc" >/dev/null 2>&1; then
              echo
              echo "FOUND: $cc"
              command -v "$cc"
              "$cc" --version || true
              found=1
            else
              echo "NOT FOUND: $cc"
            fi
          done

          echo
          if [ "$found" -eq 0 ]; then
            echo "::notice::No ARM cross compiler is currently installed."
          fi

      - name: Check repository for bundled toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Toolchain directories ==="

          if [ -d gcc ]; then
            echo "gcc/ directory exists"
            find gcc -maxdepth 4 -type f -name '*gcc' -print
          else
            echo "No gcc/ directory in public repository."
            echo "::notice::The public patch repository does not contain the inherited BSP toolchain."
          fi

      - name: Inspect patch for compiler hints
        shell: bash
        run: |
          set -euo pipefail

          patch="patches/0001-oppo-a1k-cph1923-port.patch"

          echo "=== Compiler/toolchain references in patch ==="

          grep -Ein \
            'CROSS_COMPILE|TOOLCHAIN|arm-eabi|androideabi|aarch64.*gcc|gcc/' \
            "$patch" || true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## MTK LK toolchain preflight"
            echo
            echo "- Runner: Ubuntu 22.04"
            echo "- Native GCC: available"
            echo "- 32-bit host compilation: tested"
            echo "- ARM cross-compiler availability: see job log"
            echo "- Bundled BSP gcc/ directory: checked"
            echo
            echo "No LK image was built or published."
            echo "README and project sources were not modified."
          } >> "$GITHUB_STEP_SUMMARY"
